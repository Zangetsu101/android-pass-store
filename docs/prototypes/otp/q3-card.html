<!doctype html>
<!-- PROTOTYPE (throwaway). Q3: how does the otp card look and behave? Reveal policy, copy control, position. -->
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  .wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;font-family:var(--font-sans)}
  .tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center;font-family:var(--font-sans);font-size:13px;color:var(--muted-foreground)}
  .tabs button{font:inherit;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--foreground);cursor:pointer}
  .tabs button.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
  .side{flex:1 1 240px;font-size:13px;line-height:1.5;color:var(--foreground)}
  .side h3{margin:0 0 6px;font-size:14px}
  .side ul{margin:6px 0 12px;padding-left:18px}
  .side pre{font-family:var(--font-mono);font-size:11px;background:var(--code-background);padding:10px;border-radius:var(--radius);white-space:pre-wrap;word-break:break-all;margin:6px 0 0}
  .side .dim{color:var(--muted-foreground)}
  .phone{--bg:#0B0D0B;--surface:#0F120F;--raised:#131A13;--border:#1D2B1D;--border2:#243324;--accent:#39FF6B;--accentDim:#39FF6B20;--accentMid:#39FF6B44;--text:#C8E6C9;--dim:#527A52;--faint:#2E4A2E;--warn:#FFCC44;
    flex:0 0 340px;max-width:100%;height:640px;background:var(--bg);border:1px solid var(--border2);border-radius:16px;overflow:auto;
    font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;color:var(--text);box-sizing:border-box}
  .phone *{box-sizing:border-box}
  .top{display:flex;align-items:center;padding:12px 16px 10px;border-bottom:1px solid var(--border)}
  .cap{font-size:11px;color:var(--dim)}
  .title{font-size:16px;font-weight:700;color:var(--accent)}
  .body{padding:16px 18px}
  .label{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--accent);margin:0 0 6px}
  .card{background:var(--surface);border:1px solid var(--border2);border-radius:4px;padding:12px 14px;margin-bottom:6px;word-break:break-all}
  .faint{font-size:11px;color:var(--faint);margin-bottom:20px}
  .btns{display:flex;gap:6px;margin-top:8px}
  .btn{flex:1;height:40px;border-radius:3px;font:inherit;cursor:pointer;background:var(--surface);color:var(--dim);border:1px solid var(--border2)}
  .btn.p{background:var(--accentDim);color:var(--accent);border-color:var(--accentMid)}
  .pw{color:var(--accent);letter-spacing:.1em}
  .blur{filter:blur(5px)}
  .code{font-size:26px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
  .late{color:var(--warn)!important}
  .bar{height:2px;background:var(--border2);margin-top:8px}
  .bar b{display:block;height:100%;background:var(--accent)}
  .secs{font-size:11px;color:var(--dim)}
  .tag{font-size:10px;color:var(--accent);border:1px solid var(--accentMid);background:var(--accentDim);border-radius:3px;padding:2px 6px;margin-left:auto}
  .fold{display:flex;justify-content:space-between;cursor:pointer;color:var(--dim);font-size:11px}
  .ring{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:var(--dim)}
  .ring i{font-style:normal;background:var(--surface);width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
  .tap{cursor:pointer}.tap:active{background:var(--raised)}
</style>

<div class="tabs" id="vt"></div>
<div class="tabs" id="pt">otp card position:</div>
<div class="wrap">
  <div class="phone" id="phone"></div>
  <div class="side" id="side"></div>
</div>

<script>
const V={
 A:["A · Visible + copy button","The code is readable as soon as the entry is decrypted. A bar shows the time that remains.",["Best when you type the code on a different device.","Any person who sees the screen sees the code, but the code stops working in 30 seconds or less.","Different from the password card, which starts hidden."]],
 B:["B · Hidden, same as password","The code starts blurred. It has <b>copy</b> and <b>reveal</b> buttons, the same as the password card.",["Consistent: all secrets start hidden.","One more tap each time you must read the code.","Copy works without a reveal."]],
 C:["C · Tap the card to copy","No buttons. The full card is the copy control. A ring shows the time that remains.",["Smallest card. One large tap target.","The copy control is less obvious, so the card has a hint line.","The code is always visible."]]};
let v="A",pos="below",rev=false,copied=false;
const $=s=>document.querySelector(s);
const code=()=>{let h=Math.floor(Date.now()/30000)*7919%1000000;const s=String(h).padStart(6,"0");return s.slice(0,3)+" "+s.slice(3)};
$("#vt").innerHTML=Object.keys(V).map(k=>`<button data-v="${k}">${V[k][0]}</button>`).join("");
$("#pt").innerHTML+=`<button data-p="below">below password</button><button data-p="above">above password</button>`;
document.body.addEventListener("click",ev=>{const t=ev.target.closest("[data-v],[data-p],[data-rev],[data-copy]");if(!t)return;const d=t.dataset;
 if(d.v){v=d.v;rev=copied=false}if(d.p)pos=d.p;if(d.rev!==undefined)rev=!rev;if(d.copy!==undefined){copied=true;setTimeout(()=>{copied=false;render()},1500)}render()});
function render(){
 document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
 document.querySelectorAll("[data-p]").forEach(b=>b.classList.toggle("on",b.dataset.p===pos));
 const pw=`<div class="label">password</div><div class="card"><div class="pw blur">orbit-river-cobalt-42</div><div class="btns"><button class="btn p">copy</button><button class="btn">reveal</button></div></div><div class="faint">decrypted in-memory</div>`;
 let otp='<div class="label">otp</div>';
 if(v==="A")otp+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="code" id="code"></span><span class="secs" id="secs"></span></div><div class="bar"><b id="bar"></b></div><div class="btns"><button class="btn p" data-copy>${copied?"copied":"copy code"}</button></div></div>`;
 if(v==="B")otp+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="code ${rev?"":"blur"}" id="code"></span><span class="secs" id="secs"></span></div><div class="bar"><b id="bar"></b></div><div class="btns"><button class="btn p" data-copy>${copied?"copied":"copy"}</button><button class="btn" data-rev>${rev?"hide":"reveal"}</button></div></div>`;
 if(v==="C")otp+=`<div class="card tap" data-copy style="display:flex;align-items:center;justify-content:space-between;${copied?"border-color:var(--accentMid)":""}"><div><div class="code" id="code"></div><div class="cap" style="margin-top:4px">${copied?"copied":"tap to copy"}</div></div><div class="ring" id="ring"><i id="secs"></i></div></div>`;
 otp+=`<div class="faint">${copied?"clipboard clears in 45s":"totp · 6 digits · 30s"}</div>`;
 $("#phone").innerHTML=`<div class="top"><span style="color:var(--dim);margin-right:10px">‹</span><div><div class="cap">github.com</div><div class="title">alex.dev</div></div></div><div class="body">${pos==="above"?otp+pw:pw+otp}<div class="label">notes</div><div class="card">url: https://github.com</div><div style="height:14px"></div><div class="label">metadata</div><div class="card cap">path &nbsp; dev/github.com/alex.dev.gpg</div></div>`;
 const n=V[v];$("#side").innerHTML=`<h3>${n[0]}</h3><div>${n[1]}</div><ul>${n[2].map(x=>`<li>${x}</li>`).join("")}</ul><div class="dim">The code and the bar change to yellow in the last 5 seconds. An entry with only OTP has no password card, so the position applies only to entries with the two secrets.</div>`;tick()}
function tick(){const left=30-(Date.now()/1000)%30,late=left<6,col=late?"#FFCC44":"#39FF6B",c=$("#code");if(!c)return;c.textContent=code();c.classList.toggle("late",late);
 const b=$("#bar");if(b){b.style.width=(left/30*100)+"%";b.style.background=col}
 const r=$("#ring");if(r)r.style.background=`conic-gradient(${col} ${left/30*360}deg,#243324 0)`;
 $("#secs").textContent=Math.ceil(left)+(r?"":"s")}
setInterval(tick,250);render();
</script>
