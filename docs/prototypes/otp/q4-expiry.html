<!doctype html>
<!-- PROTOTYPE (throwaway). Q4: what happens when the code gets near its end, and after a copy? -->
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  .wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;font-family:var(--font-sans)}
  .tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center;font-family:var(--font-sans);font-size:13px;color:var(--muted-foreground)}
  .tabs button{font:inherit;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--foreground);cursor:pointer}
  .tabs button.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
  .side{flex:1 1 240px;font-size:13px;line-height:1.5;color:var(--foreground)}
  .side h3{margin:0 0 6px;font-size:14px}
  .side ul{margin:6px 0 12px;padding-left:18px}
  .side pre{font-family:var(--font-mono);font-size:11px;background:var(--code-background);padding:10px;border-radius:var(--radius);white-space:pre-wrap;word-break:break-all;margin:6px 0 0}
  .side .dim{color:var(--muted-foreground)}
  .phone{--bg:#0B0D0B;--surface:#0F120F;--raised:#131A13;--border:#1D2B1D;--border2:#243324;--accent:#39FF6B;--accentDim:#39FF6B20;--accentMid:#39FF6B44;--text:#C8E6C9;--dim:#527A52;--faint:#2E4A2E;--warn:#FFCC44;
    flex:0 0 340px;max-width:100%;height:640px;background:var(--bg);border:1px solid var(--border2);border-radius:16px;overflow:auto;
    font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;color:var(--text);box-sizing:border-box}
  .phone *{box-sizing:border-box}
  .top{display:flex;align-items:center;padding:12px 16px 10px;border-bottom:1px solid var(--border)}
  .cap{font-size:11px;color:var(--dim)}
  .title{font-size:16px;font-weight:700;color:var(--accent)}
  .body{padding:16px 18px}
  .label{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--accent);margin:0 0 6px}
  .card{background:var(--surface);border:1px solid var(--border2);border-radius:4px;padding:12px 14px;margin-bottom:6px;word-break:break-all}
  .faint{font-size:11px;color:var(--faint);margin-bottom:20px}
  .btns{display:flex;gap:6px;margin-top:8px}
  .btn{flex:1;height:40px;border-radius:3px;font:inherit;cursor:pointer;background:var(--surface);color:var(--dim);border:1px solid var(--border2)}
  .btn.p{background:var(--accentDim);color:var(--accent);border-color:var(--accentMid)}
  .pw{color:var(--accent);letter-spacing:.1em}
  .blur{filter:blur(5px)}
  .code{font-size:26px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
  .late{color:var(--warn)!important}
  .bar{height:2px;background:var(--border2);margin-top:8px}
  .bar b{display:block;height:100%;background:var(--accent)}
  .secs{font-size:11px;color:var(--dim)}
  .tag{font-size:10px;color:var(--accent);border:1px solid var(--accentMid);background:var(--accentDim);border-radius:3px;padding:2px 6px;margin-left:auto}
  .fold{display:flex;justify-content:space-between;cursor:pointer;color:var(--dim);font-size:11px}
  .ring{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:var(--dim)}
  .ring i{font-style:normal;background:var(--surface);width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
  .tap{cursor:pointer}.tap:active{background:var(--raised)}
</style>

<div class="tabs" id="vt"></div>
<div class="tabs">time: <button data-jump="8">go to last 8s</button><button data-jump="2">go to last 2s</button><span id="st"></span></div>
<div class="wrap">
  <div class="phone" id="phone"></div>
  <div class="side" id="side"></div>
</div>

<script>
const V={
 A:["A · Plain","The code changes at 0. The hint shows <b>copied</b> for a short time, then goes back to <b>tap to copy</b>.",["Simplest. Same pattern as the password card.","After the code changes, nothing tells you that the clipboard holds an old code."]],
 B:["B · Show the next code","Same as A. In the last 10 seconds, a second line shows the next code. Tap that line to copy the next code.",["You do not have to wait when little time remains.","Most servers accept the next code a few seconds early, but not all servers do.","More content on the card for 10 of each 30 seconds."]],
 C:["C · Mark an old copy","The hint stays <b>copied</b> while the copied code is valid. When the code changes, the hint changes to <b>copied code expired · tap to copy new</b>.",["Tells you why a paste failed.","One more state to build. No more controls."]]};
let v="C",off=0,copiedP=null,copiedAt=0;
const $=s=>document.querySelector(s);
const now=()=>Date.now()+off, per=()=>Math.floor(now()/30000);
const code=p=>{const s=String(p*7919%1000000).padStart(6,"0");return s.slice(0,3)+" "+s.slice(3)};
$("#vt").innerHTML=Object.keys(V).map(k=>`<button data-v="${k}">${V[k][0]}</button>`).join("");
document.body.addEventListener("click",ev=>{const t=ev.target.closest("[data-v],[data-jump],[data-copy]");if(!t)return;const d=t.dataset;
 if(d.v){v=d.v;copiedP=null;side()}
 if(d.jump)off+=((30-(now()/1000)%30)-d.jump)*1000;
 if(d.copy!==undefined){copiedP=per()+(+d.copy);copiedAt=Date.now()}
 tick()});
function side(){document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));const n=V[v];
 $("#side").innerHTML=`<h3>${n[0]}</h3><div>${n[1]}</div><ul>${n[2].map(x=>`<li>${x}</li>`).join("")}</ul><div class="dim">Tap the card to copy. Then use the time buttons to go near the end of the code and watch the change. In all variants, the code and the ring change to yellow in the last 5 seconds.</div>`}
function tick(){const left=30-(now()/1000)%30,late=left<6,col=late?"#FFCC44":"#39FF6B",p=per();
 let hint="tap to copy",hc="";const fresh=Date.now()-copiedAt<1500;
 if(v==="C"&&copiedP!==null){if(copiedP>=p){hint="copied";hc="color:#39FF6B"}else{hint="copied code expired · tap to copy new";hc="color:#FFCC44"}}
 else if(fresh&&copiedP===p){hint="copied";hc="color:#39FF6B"}
 const next=v==="B"&&left<=10?`<div class="card tap" data-copy="1" style="display:flex;justify-content:space-between;align-items:center;margin-top:-7px;border-top-color:var(--border)"><span class="cap">next</span><span style="color:var(--dim);letter-spacing:.08em;font-weight:700">${code(p+1)}</span><span class="cap">${fresh&&copiedP===p+1?"copied":"tap to copy"}</span></div>`:"";
 $("#phone").innerHTML=`<div class="top"><span style="color:var(--dim);margin-right:10px">‹</span><div><div class="cap">github.com</div><div class="title">alex.dev</div></div></div><div class="body"><div class="label">password</div><div class="card"><div class="pw blur">orbit-river-cobalt-42</div><div class="btns"><button class="btn p">copy</button><button class="btn">reveal</button></div></div><div class="faint">decrypted in-memory</div><div class="label">otp</div><div class="card tap" data-copy="0" style="display:flex;align-items:center;justify-content:space-between"><div><div class="code ${late?"late":""}">${code(p)}</div><div class="cap" style="margin-top:4px;${hc}">${hint}</div></div><div class="ring" style="background:conic-gradient(${col} ${left/30*360}deg,#243324 0)"><i>${Math.ceil(left)}</i></div></div>${next}<div class="faint">${copiedP!==null?"clipboard clears in 45s":"totp · 6 digits · 30s"}</div><div class="label">notes</div><div class="card">url: https://github.com</div></div>`;
 $("#st").textContent=Math.ceil(left)+"s remain"}
setInterval(tick,250);side();tick();
</script>
