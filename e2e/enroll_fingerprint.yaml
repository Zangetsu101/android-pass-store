appId: com.android.settings
---
- extendedWaitUntil:
    visible: "Enter your PIN"
    timeout: 10000
- inputText: "1234"
- pressKey: Enter
- tapOn:
    text: "More"
    optional: true
- tapOn:
    text: "I agree"
    optional: true
- tapOn:
    text: "Next"
    optional: true
- extendedWaitUntil:
    visible: ".*Touch.*sensor.*|.*touch.*sensor.*"
    timeout: 15000
- extendedWaitUntil:
    visible: ".*Fingerprint added.*"
    timeout: 60000
- tapOn: "Done"
