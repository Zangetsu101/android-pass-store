appId: com.zangetsu101.pass
---
# The GPG auth subkey is read-only on the shared fixture repo.
- runFlow:
    file: ../shared/setup_store.yaml
    env:
      KEY_FILE: test-key-auth.asc
      USE_GPG_AUTH: "true"
- extendedWaitUntil:
    visible: "synced · .*"
    timeout: 10000
- tapOn: "synced · .*"
- extendedWaitUntil:
    visible: "✓ sync complete"
    timeout: 60000
- takeScreenshot: "24-synced"
- tapOn: "alex\\.dev"
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible: "start session"
    timeout: 5000
- tapOn: "enter passphrase"
- inputText: "testpass"
- pressKey: Enter
- scrollUntilVisible:
    element: "edit"
    direction: DOWN
    timeout: 60000
- tapOn: "edit"
- assertVisible: "edit entry"
- tapOn: "edit password"
- eraseText: 128
- inputText: "edited-password-23"
- hideKeyboard
- tapOn: "save entry"
- extendedWaitUntil:
    visible: "saved locally · push failed"
    timeout: 30000
- tapOn: "reveal"
- assertVisible: "edited-password-23"
- back
- extendedWaitUntil:
    visible: "↑1 unpushed"
    timeout: 10000
- takeScreenshot: "24-unpushed"
- tapOn: "↑1 unpushed"
- extendedWaitUntil:
    visible: ".*view details.*"
    timeout: 60000
- assertVisible: "error"
- takeScreenshot: "24-sync-error"
- tapOn: ".*view details.*"
- assertVisible: "sync recovery"
- assertVisible: "Edit password for dev/github\\.com/alex\\.dev using editor\\."
- assertVisible: "dev/github\\.com/alex\\.dev"
- takeScreenshot: "24-sync-recovery"
