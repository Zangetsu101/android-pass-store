appId: com.zangetsu101.pass
---
# The GPG auth key can clone the fixture store. It cannot push to it.
- runFlow:
    file: ../shared/setup_store.yaml
    env:
      KEY_FILE: test-key-auth.asc
      USE_GPG_AUTH: "true"
- assertVisible: "flat view"
- takeScreenshot: "26-home-tree"
- tapOn: "add entry"
- assertVisible: "new entry"
- takeScreenshot: "26-new-entry"
- tapOn: "entry path"
- inputText: "dev/git"
- hideKeyboard
- assertVisible: "folder"
- takeScreenshot: "26-folder-suggestions"
- tapOn: "entry path"
- eraseText: 8
- inputText: "alex"
- hideKeyboard
- assertVisible: "exists"
- assertVisible: ".*more · keep typing"
- takeScreenshot: "26-entry-suggestions"
- tapOn: "entry path"
- eraseText: 5
- inputText: "email//gmail"
- hideKeyboard
- assertVisible: "path has an empty segment"
- takeScreenshot: "26-path-error"
- tapOn: "entry path"
- eraseText: 13
- inputText: "new/example.com/new-login-26"
- tapOn: "edit password"
- inputText: "test-password-26"
- hideKeyboard
- tapOn: "\\+ notes / username"
- tapOn: "edit notes"
- inputText: "username: demo"
- pressKey: Enter
- pressKey: Enter
- inputText: "research fixture"
- hideKeyboard
- assertVisible: ".*3 lines of notes"
- takeScreenshot: "26-notes-and-enabled-save"
- tapOn: "save entry"
- extendedWaitUntil:
    visible: "added new/example\\.com/new-login-26"
    timeout: 30000
- assertVisible:
    checked: true
    containsDescendants:
      - text: "new-login-26"
- assertNotVisible: "new entry"
- takeScreenshot: "26-home-tree-selected"
- extendedWaitUntil:
    visible: "↑1 unpushed"
    timeout: 30000
- tapOn: "flat view"
- assertVisible:
    checked: true
    containsDescendants:
      - text: "new-login-26"
- takeScreenshot: "26-home-flat-selected"
