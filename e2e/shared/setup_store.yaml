appId: com.zangetsu101.pass
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "> pass init"
    timeout: 8000
- tapOn: "> pass init"

- assertVisible: "import from file"
- tapOn: "import from file"

# File picker — navigate to Downloads only if file not already visible
- runFlow:
    when:
      notVisible:
        text: "${KEY_FILE}"
    commands:
      - tapOn: "Show roots"
      - extendedWaitUntil:
          visible:
            text: "Downloads"
          timeout: 5000
      - tapOn: "Downloads"
- extendedWaitUntil:
    visible:
      text: "${KEY_FILE}"
    timeout: 5000
- tapOn: "${KEY_FILE}"

- assertVisible: "> gpg --import"
- tapOn: "> gpg --import"
- extendedWaitUntil:
    visible:
      text: "key imported"
    timeout: 10000
- assertVisible: "stored securely"

- tapOn: "continue"

- runFlow:
    when:
      true: ${USE_GPG_AUTH == 'true'}
    commands:
      - assertVisible: "use gpg auth key"
- assertVisible: "git@github.com:"
- assertVisible: "user/pass-store.git"
- tapOn: "user/pass-store.git"
- inputText: "Zangetsu101/pass-test-store.git"
- tapOn: "> git clone"

- runFlow:
    when:
      true: ${USE_GPG_AUTH == 'true'}
    commands:
      - assertVisible: "gpg passphrase"
      - tapOn: "passphrase"
      - inputText: "testpass"
      - tapOn: "confirm"

- extendedWaitUntil:
    visible:
      text: "alex\\.dev"
    timeout: 60000
