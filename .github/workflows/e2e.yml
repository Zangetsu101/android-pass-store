name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    name: Maestro (API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Install Maestro 2.12.1
        run: |
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          echo "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  $RUNNER_TEMP/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro"
          echo "$HOME/.maestro/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p build/e2e
            adb shell locksettings set-pin 1234
            adb shell am start -a android.settings.FINGERPRINT_ENROLL
            (for i in $(seq 1 60); do sleep 1; adb emu finger touch 1; done) > build/e2e/fingerprint-console.log 2>&1 &
            finger_pid=$!
            trap 'kill "$finger_pid" 2>/dev/null || true' EXIT
            maestro test --test-output-dir build/e2e/enrollment --debug-output build/e2e/enrollment-debug e2e/enroll_fingerprint.yaml
            kill "$finger_pid" 2>/dev/null || true
            ./gradlew e2eInstall --console=plain
            mkdir -p build/e2e
            maestro test --format junit --output build/e2e/report.xml --test-output-dir build/e2e/artifacts --debug-output build/e2e/debug e2e/flow_ci.yaml

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results-${{ github.sha }}
          path: build/e2e/
          if-no-files-found: ignore
          retention-days: 7
