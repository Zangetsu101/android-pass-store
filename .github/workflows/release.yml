name: Release

# Push a tag such as v0.3.0 to start a release. The tag must match
# versionName in app/build.gradle.kts. The workflow builds a signed release
# APK and creates a draft GitHub release. Edit the notes, then publish it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      apk: ${{ steps.version.outputs.apk }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check that the tag matches versionName
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          version_name="$(sed -nE 's/^\s*versionName\s*=\s*"([^"]+)".*/\1/p' app/build.gradle.kts)"
          if [ "$version" != "$version_name" ]; then
            echo "::error::Tag $tag does not match versionName \"$version_name\" in app/build.gradle.kts."
            exit 1
          fi
          echo "apk=pass-android-$version.apk" >> "$GITHUB_OUTPUT"

  build:
    name: Build APK
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/build-apk.yml
    with:
      apk-name: ${{ needs.check.outputs.apk }}
    secrets: inherit

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          APK: ${{ needs.build.outputs.apk-name }}
        run: |
          checksum="$(cat "$APK.sha256")"
          cat > notes.md <<EOF
          ## What's changed

          TODO: write the release notes.

          ## Download / Install

          1. Download \`$APK\` from the release assets below.
          2. Open the APK on your Android device.
          3. If prompted, allow installation from this source.
          4. Install the app.

          Android may show a warning because this APK is installed outside the Play Store.

          ## Checksum

          SHA-256:

          \`\`\`text
          $checksum
          \`\`\`

          Optional: verify after download:

          \`\`\`bash
          sha256sum $APK
          \`\`\`
          EOF
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md
