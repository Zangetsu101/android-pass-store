name: Release

# Push a tag such as v0.3.0 to start a release. The tag must match
# versionName in app/build.gradle.kts. The workflow builds a signed release
# APK and creates a draft GitHub release. Edit the notes, then publish it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check that the tag matches versionName
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          version_name="$(sed -nE 's/^\s*versionName\s*=\s*"([^"]+)".*/\1/p' app/build.gradle.kts)"
          if [ "$version" != "$version_name" ]; then
            echo "::error::Tag $tag does not match versionName \"$version_name\" in app/build.gradle.kts."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apk=pass-android-$version.apk" >> "$GITHUB_OUTPUT"

      - name: Write the signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # Without these secrets, Gradle signs with the debug key.
          # A debug-signed APK cannot upgrade an existing install, so stop here.
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The release signing secret for $name is not set."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify the APK signature
        env:
          APK: ${{ steps.version.outputs.apk }}
        run: |
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          "$build_tools/apksigner" verify --print-certs "$APK" | tee signer.txt
          if grep -q "CN=Android Debug" signer.txt; then
            echo "::error::The APK is signed with the debug key."
            exit 1
          fi
          sha256sum "$APK" > "$APK.sha256"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.version.outputs.apk }}
        run: |
          checksum="$(cat "$APK.sha256")"
          cat > notes.md <<EOF
          ## What's changed

          TODO: write the release notes.

          ## Download / Install

          1. Download \`$APK\` from the release assets below.
          2. Open the APK on your Android device.
          3. If prompted, allow installation from this source.
          4. Install the app.

          Android may show a warning because this APK is installed outside the Play Store.

          ## Checksum

          SHA-256:

          \`\`\`text
          $checksum
          \`\`\`

          Optional: verify after download:

          \`\`\`bash
          sha256sum $APK
          \`\`\`
          EOF
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md

      - name: Remove signing files
        if: always()
        run: rm -f release.keystore keystore.properties
